// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
        classpath 'com.google.gms:google-services:4.4.1'
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
    // LogRocket React Native — native Android module artifacts
    maven { url 'https://storage.googleapis.com/logrocket-maven/' }
  }
}

ext {
  // LogRocket RN @1.62 requires Android API 25 (7.1). Expo default is 24.
  // Android 7.0 install base < 0.5% globally; bumping is preferable to
  // tools:overrideLibrary (which masks runtime crashes).
  minSdkVersion = 25
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
