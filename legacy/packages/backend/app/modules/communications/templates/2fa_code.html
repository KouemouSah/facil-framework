{% extends "base.html" %}

{% block content %}
<h2>{{ title }}</h2>
<p>{{ greeting }}</p>
<p>{{ message }}</p>

<div class="code-box">
    <div class="code">{{ code }}</div>
</div>

<div class="alert-box alert-info">
    <p style="margin: 0;"><strong>{{ expiry_label }}</strong> {{ expiry_time }}</p>
</div>

<div class="alert-box alert-warning">
    <p style="margin: 0;">{{ security_warning }}</p>
</div>
{% endblock %}
