{% extends "base.html" %}

{% block content %}
<h2 style="color: #10b981;">{{ title }}</h2>
<p>{{ greeting }}</p>
<p>{{ message }}</p>
<p>{{ login_message }}</p>

<div style="text-align: center; margin: 30px 0;">
    <a href="{{ login_url }}" class="button">{{ button_text }}</a>
</div>

<div class="alert-box alert-danger">
    <p style="margin: 0;">{{ warning_text }}</p>
</div>
{% endblock %}
