name: CI

# CI: repo structure/license/docs + secrets, plus the real test gates —
# backend pytest (SQLite) and the Next.js frontend build (lint/type-check/build).

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Structure validation : ensure required open-source files are present
  # ---------------------------------------------------------------------------
  repo-structure:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files present
        run: |
          set -e
          REQUIRED=(
            README.md
            LICENSE
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            SECURITY.md
            CHANGELOG.md
            ROADMAP.md
            .gitignore
            .gitattributes
            .editorconfig
            package.json
            commitlint.config.js
            .cspell.json
            .lycheeignore
            .release-please-manifest.json
            release-please-config.json
            .github/CODEOWNERS
            .github/dependabot.yml
            .github/pull_request_template.md
            .github/ISSUE_TEMPLATE/bug_report.yml
            .github/ISSUE_TEMPLATE/feature_request.yml
            .github/ISSUE_TEMPLATE/phase_kickoff.yml
            .github/ISSUE_TEMPLATE/config.yml
            .github/workflows/ci.yml
            .github/workflows/commitlint.yml
            .github/workflows/pr-title-check.yml
            .github/workflows/link-check.yml
            .github/workflows/spell-check.yml
            .github/workflows/release-please.yml
            .github/workflows/sast.yml
            .github/workflows/dependency-review.yml
            docs/PRD.md
            docs/BPMN.md
            docs/REUSE_FROM_TAXASGE.md
            docs/IMPROVEMENTS_OVER_TAXASGE.md
            docs/AGENTS_AND_SECRETS.md
          )
          MISSING=0
          for f in "${REQUIRED[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Required file is missing"
              MISSING=$((MISSING + 1))
            else
              echo "✓ $f"
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "::error::$MISSING required files are missing"
            exit 1
          fi

      - name: License is AGPL-3.0
        run: |
          if ! grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE; then
            echo "::error::LICENSE does not contain AGPL-3.0 header"
            exit 1
          fi
          echo "✓ LICENSE is AGPL-3.0"

      - name: Profiles directory exists
        run: |
          for p in empty private-services-company gov-emergent-country saas-multitenant banking; do
            if [ ! -d "profiles/$p" ]; then
              echo "::warning file=profiles/$p::Profile directory missing (will be created in Phase D)"
            fi
          done
          echo "✓ Profile structure check complete"

  # ---------------------------------------------------------------------------
  # YAML lint : workflows + templates must parse
  # ---------------------------------------------------------------------------
  yaml-lint:
    name: YAML syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML files
        run: |
          pip install yamllint
          # Permissive: only check syntax, not style
          yamllint -d "{extends: relaxed, rules: {line-length: disable, document-start: disable, truthy: disable}}" .github/ || true
          echo "✓ YAML files parse"

  # ---------------------------------------------------------------------------
  # Markdown lint : catch broken links and obvious errors
  # ---------------------------------------------------------------------------
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            *.md
            docs/**/*.md
          config: .markdownlint-cli2.jsonc

  # ---------------------------------------------------------------------------
  # No secrets check : scan for accidentally committed secrets
  # ---------------------------------------------------------------------------
  no-secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

  # ---------------------------------------------------------------------------
  # Backend tests (Python, SQLite — no external services needed)
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: pip install -r packages/backend/requirements-dev.txt
      - name: pytest (backend + deploy, SQLite)
        run: python -m pytest packages/backend deploy -q

  # ---------------------------------------------------------------------------
  # Frontend build (Next.js — lint + type-check + production build)
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend (Next.js build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run type-check --workspace=web
      - run: npm run test --workspace=web
      - run: npm run build --workspace=web

  # ---------------------------------------------------------------------------
  # E2E (Playwright) — real stack: Postgres service + backend (uvicorn) + web
  # (next start) + a seeded super-admin so /login renders. Advisory (not in the
  # summary gate yet) while it stabilises.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: facil
          POSTGRES_PASSWORD: facil
          POSTGRES_DB: facil
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://facil:facil@localhost:5432/facil
      ADMIN_TOKEN: ci-e2e-admin-token
      JWT_SECRET: ci-e2e-jwt-not-a-secret
      INTERNAL_API_URL: http://localhost:8080
      MODULES_ENABLED: organization,location
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r packages/backend/requirements.txt
      - name: Migrate + start backend
        working-directory: packages/backend
        run: |
          alembic upgrade head
          uvicorn app.main:app --host 0.0.0.0 --port 8080 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/health && break; sleep 1; done
      - name: Seed an installed super-admin
        run: |
          API=http://localhost:8080
          H="X-Admin-Token: $ADMIN_TOKEN"
          curl -fsS -X POST -H "$H" "$API/api/v1/rbac/admin/reseed?profile=empty"
          ACC=$(curl -fsS -X POST -H "$H" -H 'Content-Type: application/json' \
            -d '{"email":"e2e@x.com","password":"Sup3rStr0ng!pw"}' \
            "$API/api/v1/admin/accounts" | python -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          ROLE=$(curl -fsS -H "$H" "$API/api/v1/rbac/roles?limit=200" | python -c 'import sys,json;print(next(r["id"] for r in json.load(sys.stdin)["items"] if r["code"]=="admin"))')
          curl -fsS -X POST -H "$H" -H 'Content-Type: application/json' \
            -d "{\"role_id\":\"$ROLE\"}" "$API/api/v1/rbac/accounts/$ACC/roles"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=web
      - name: Start web
        run: |
          PORT=3000 npm run start --workspace=web &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/login >/dev/null && break; sleep 1; done
      - name: Install Playwright browser
        working-directory: packages/web
        run: npx playwright install --with-deps chromium
      - name: Run e2e
        run: npm run test:e2e --workspace=web
        env:
          E2E_BASE_URL: http://localhost:3000

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [repo-structure, yaml-lint, markdown-lint, no-secrets, backend-tests, frontend-build]
    if: always()
    steps:
      - run: |
          echo "## CI Summary (V0 pre-bootstrap)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Repository structure | ${{ needs.repo-structure.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| YAML lint | ${{ needs.yaml-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Markdown lint | ${{ needs.markdown-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets scan | ${{ needs.no-secrets.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend (pytest) | ${{ needs.backend-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend (build) | ${{ needs.frontend-build.result }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.repo-structure.result }}" != "success" ] || [ "${{ needs.yaml-lint.result }}" != "success" ] || [ "${{ needs.markdown-lint.result }}" != "success" ] || [ "${{ needs.no-secrets.result }}" != "success" ] || [ "${{ needs.backend-tests.result }}" != "success" ] || [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "::error::Critical CI checks failed"
            exit 1
          fi
