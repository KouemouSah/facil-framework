name: CI — Tests Backend & Frontend

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: packages/backend/requirements.txt

      - name: Install system dependencies (PDF rendering)
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list || true
          sudo apt-get update -qq || true
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev libffi-dev shared-mime-info

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov mypy ruff black

      - name: Lint (ruff)
        run: ruff check app || true  # not blocking V0

      - name: Format check (black)
        run: black --check app || true  # not blocking V0

      - name: Type check (mypy)
        run: mypy app || true  # not blocking V0

      - name: Run tests with pytest
        env:
          ENVIRONMENT: testing
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          JWT_SECRET_KEY: test-secret-do-not-use-in-prod
        run: |
          if [ -d tests ]; then
            pytest tests/ -v --tb=short --cov=app --cov-report=term-missing || true
          else
            echo "No tests directory yet — skipping (V0 pre-bootstrap state)"
          fi

  frontend-tests:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          elif [ -f packages/web/package-lock.json ]; then
            cd packages/web && npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Lint (ESLint)
        working-directory: packages/web
        run: npx eslint src --ext .ts,.tsx --max-warnings=200 || true  # not blocking V0

      - name: Type check (tsc)
        working-directory: packages/web
        run: npm run type-check || true  # not blocking V0

      - name: i18n key parity (ES/FR/EN)
        run: |
          if [ -f packages/web/messages/es.json ]; then
            node -e "
            const es = require('./packages/web/messages/es.json');
            const fr = require('./packages/web/messages/fr.json');
            const en = require('./packages/web/messages/en.json');
            function flat(obj, p='') {
              let k = [];
              for (const [key,v] of Object.entries(obj)) {
                const path = p ? p+'.'+key : key;
                if (typeof v === 'object' && v !== null && !Array.isArray(v)) k.push(...flat(v, path));
                else k.push(path);
              }
              return k;
            }
            const esK = new Set(flat(es)), frK = new Set(flat(fr)), enK = new Set(flat(en));
            const all = new Set([...esK, ...frK, ...enK]);
            const mES = [...all].filter(k => !esK.has(k));
            const mFR = [...all].filter(k => !frK.has(k));
            const mEN = [...all].filter(k => !enK.has(k));
            console.log('ES:', esK.size, 'FR:', frK.size, 'EN:', enK.size);
            if (mES.length || mFR.length || mEN.length) {
              console.error('MISSING ES:', mES.length, mES.slice(0,5));
              console.error('MISSING FR:', mFR.length, mFR.slice(0,5));
              console.error('MISSING EN:', mEN.length, mEN.slice(0,5));
              process.exit(1);
            }
            console.log('All 3 files have identical key sets.');
            "
          else
            echo "No i18n files yet — skipping"
          fi

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: always()
    steps:
      - run: |
          echo "Backend: ${{ needs.backend-tests.result }}"
          echo "Frontend: ${{ needs.frontend-tests.result }}"
          if [ "${{ needs.backend-tests.result }}" != "success" ] || [ "${{ needs.frontend-tests.result }}" != "success" ]; then
            echo "::warning::Some checks did not pass cleanly. V0 pre-bootstrap state — non-blocking."
          fi
