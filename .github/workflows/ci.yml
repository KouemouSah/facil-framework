name: CI

# V0 pre-bootstrap CI : validates repo structure, license, docs.
# Backend/frontend test matrices are intentionally disabled until
# Phase A.5 (Module Loader) lands actual sanitized code.

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Structure validation : ensure required open-source files are present
  # ---------------------------------------------------------------------------
  repo-structure:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files present
        run: |
          set -e
          REQUIRED=(
            README.md
            LICENSE
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            SECURITY.md
            CHANGELOG.md
            ROADMAP.md
            .gitignore
            .gitattributes
            .editorconfig
            package.json
            commitlint.config.js
            .cspell.json
            .lycheeignore
            .release-please-manifest.json
            release-please-config.json
            .github/CODEOWNERS
            .github/dependabot.yml
            .github/pull_request_template.md
            .github/ISSUE_TEMPLATE/bug_report.yml
            .github/ISSUE_TEMPLATE/feature_request.yml
            .github/ISSUE_TEMPLATE/phase_kickoff.yml
            .github/ISSUE_TEMPLATE/config.yml
            .github/workflows/ci.yml
            .github/workflows/commitlint.yml
            .github/workflows/pr-title-check.yml
            .github/workflows/link-check.yml
            .github/workflows/spell-check.yml
            .github/workflows/release-please.yml
            .github/workflows/sast.yml
            .github/workflows/dependency-review.yml
            docs/PRD.md
            docs/BPMN.md
            docs/REUSE_FROM_TAXASGE.md
            docs/IMPROVEMENTS_OVER_TAXASGE.md
            docs/AGENTS_AND_SECRETS.md
          )
          MISSING=0
          for f in "${REQUIRED[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Required file is missing"
              MISSING=$((MISSING + 1))
            else
              echo "✓ $f"
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "::error::$MISSING required files are missing"
            exit 1
          fi

      - name: License is AGPL-3.0
        run: |
          if ! grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE; then
            echo "::error::LICENSE does not contain AGPL-3.0 header"
            exit 1
          fi
          echo "✓ LICENSE is AGPL-3.0"

      - name: Profiles directory exists
        run: |
          for p in empty private-services-company gov-emergent-country saas-multitenant banking; do
            if [ ! -d "profiles/$p" ]; then
              echo "::warning file=profiles/$p::Profile directory missing (will be created in Phase D)"
            fi
          done
          echo "✓ Profile structure check complete"

  # ---------------------------------------------------------------------------
  # YAML lint : workflows + templates must parse
  # ---------------------------------------------------------------------------
  yaml-lint:
    name: YAML syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML files
        run: |
          pip install yamllint
          # Permissive: only check syntax, not style
          yamllint -d "{extends: relaxed, rules: {line-length: disable, document-start: disable, truthy: disable}}" .github/ || true
          echo "✓ YAML files parse"

  # ---------------------------------------------------------------------------
  # Markdown lint : catch broken links and obvious errors
  # ---------------------------------------------------------------------------
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            *.md
            docs/**/*.md
          config: .markdownlint-cli2.jsonc

  # ---------------------------------------------------------------------------
  # No secrets check : scan for accidentally committed secrets
  # ---------------------------------------------------------------------------
  no-secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true  # non-blocking V0

  # ---------------------------------------------------------------------------
  # Backend / Frontend tests are deferred until Phase A.5 lands
  # Uncomment when actual sanitized code is in place
  # ---------------------------------------------------------------------------
  # backend-tests:
  #   name: Backend (Python)
  #   ... (see git history of this file for previous implementation)

  # frontend-tests:
  #   name: Frontend (Next.js)
  #   ...

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [repo-structure, yaml-lint, markdown-lint, no-secrets]
    if: always()
    steps:
      - run: |
          echo "## CI Summary (V0 pre-bootstrap)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Repository structure | ${{ needs.repo-structure.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| YAML lint | ${{ needs.yaml-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Markdown lint | ${{ needs.markdown-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets scan | ${{ needs.no-secrets.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Backend & frontend test jobs will be enabled at Phase A.5 (Module Loader)." >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.repo-structure.result }}" != "success" ] || [ "${{ needs.yaml-lint.result }}" != "success" ] || [ "${{ needs.markdown-lint.result }}" != "success" ]; then
            echo "::error::Critical V0 checks failed"
            exit 1
          fi
