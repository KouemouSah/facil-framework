name: Release images

# Build + push the backend and web container images to GHCR (Phase C). Prod runs
# pulled images — never a manual build (CLAUDE.md). Tags: per-branch + commit sha,
# plus `latest` on the default branch. Pull locally with tools/refresh-local.sh.

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/backend/**"
      - "packages/web/**"
      - ".github/workflows/release-images.yml"
  workflow_dispatch: {}

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./packages/backend
            image: facil-backend
            build_args: ""
          - name: web
            context: ./packages/web
            image: facil-web
            build_args: |
              NEXT_PUBLIC_API_URL=http://localhost:8080
              NEXT_PUBLIC_BUILD_VERSION=${{ github.sha }}
              NEXT_PUBLIC_ENVIRONMENT=production
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the owner (GHCR requires it).
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
