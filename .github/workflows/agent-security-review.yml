name: Agent — Security Review (GitHub Models)

# Specialized security-focused review for PRs touching sensitive areas:
# auth, crypto, signatures, secrets, payments, embeddings, RBAC.
# Runs in addition to the general PR Reviewer when triggered.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled]
    paths:
      - 'packages/backend/app/modules/auth/**'
      - 'packages/backend/app/modules/permissions/**'
      - 'packages/backend/app/modules/rbac/**'
      - 'packages/backend/app/core/secrets.py'
      - 'packages/backend/app/core/auth_provider.py'
      - 'packages/backend/app/core/signature/**'
      - 'packages/backend/app/core/payment_gateway.py'
      - 'packages/backend/app/core/storage_client.py'
      - 'packages/backend/app/core/llm_client.py'
      - 'packages/backend/app/core/cache.py'
      - 'packages/backend/app/database/connection.py'
      - 'packages/backend/migrations/**'
      - '**/*.sql'
      - '.github/workflows/**'
      - '.github/dependabot.yml'

permissions:
  pull-requests: write
  contents: read
  models: read

jobs:
  security-review:
    name: Security Review (GPT-4o)
    runs-on: ubuntu-latest
    if: |
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        contains(github.event.pull_request.labels.*.name, 'security') ||
        github.event.action != 'labeled' ||
        github.event.label.name == 'security'
      ) &&
      !contains(github.event.pull_request.labels.*.name, 'skip-security-review')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute diff (security-relevant paths)
        id: diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          STAT=$(git diff origin/${{ github.event.pull_request.base.ref }}...HEAD --stat | head -50)
          FULL=$(git diff origin/${{ github.event.pull_request.base.ref }}...HEAD | head -c 30000)
          {
            echo "stat<<EOF"
            echo "$STAT"
            echo "EOF"
            echo "full<<EOF"
            echo "$FULL"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Run AI security review
        id: ai
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o
          max-tokens: 1500
          system-prompt: |
            You are a security auditor reviewing a pull request to Facil Framework — a generic platform for digital services (gov, enterprise, SaaS, banking) built on FastAPI + Next.js + Postgres+pgvector + Ollama.

            Focus exclusively on security. The general code review is handled by another agent.

            Audit scope (OWASP Top 10 and beyond):

            1. **Authentication & session** — JWT handling, refresh token rotation, MFA, session fixation, lockout policy
            2. **Authorization & RBAC** — privilege escalation, IDOR, missing permission checks, audit log gaps
            3. **Injection** — SQL (asyncpg parameterized queries only), XSS, command injection, prompt injection, deserialization
            4. **Cryptography** — proper algorithm choice, key storage (AES-256-GCM at rest, never plaintext), randomness sources, signature verification, certificate handling, CRL/OCSP
            5. **Secrets management** — no hardcoded credentials, proper Secret Manager usage, env var leakage in logs
            6. **Data exposure** — over-fetching, PII in logs, GDPR right-to-erasure, encryption at rest
            7. **CSRF / SSRF** — token validation, allowlisted destinations, redirect handling
            8. **Rate limiting / DoS** — endpoint quotas, expensive operations protection
            9. **Dependency security** — known CVEs, copyleft license incompatibility, supply chain
            10. **Race conditions** — TOCTOU, missing transaction locks (Règle TaxasGE: lock ordering bundle/field payment)
            11. **Error handling** — info disclosure via stack traces, timing attacks
            12. **Logging & monitoring** — security event coverage, log integrity

            Output a markdown review with these sections:

            ## Threat assessment
            🟢 None / 🟡 Low / 🟠 Medium / 🔴 High / ⛔ Critical — one-line justification.

            ## Findings
            For each finding (or "✅ none observed"):

            **[CWE-N] Title** · 🔴/🟠/🟡 severity · file:line
            > One-line description.
            > **Risk:** consequence if exploited.
            > **Fix:** specific code change.

            Group by severity (Critical/High/Medium/Low/Info).

            ## Compliance check
            - [ ] No new secrets committed
            - [ ] All asyncpg queries use $N parameters
            - [ ] No new dependencies with known CVEs
            - [ ] Migrations are reversible (or rollback documented)
            - [ ] Audit logging covers state changes

            ## Verdict
            🛡️ Approve · 🔍 Approve with security comments · ⛔ Block (security)

            Keep concise. If no security-sensitive change, write "No security-relevant changes detected." and stop.
          prompt: |
            PR title: ${{ github.event.pull_request.title }}

            PR body:
            ${{ github.event.pull_request.body }}

            Files changed:
            ${{ steps.diff.outputs.stat }}

            Diff (truncated to 30K):
            ${{ steps.diff.outputs.full }}

      - name: Post security review
        uses: actions/github-script@v7
        env:
          REVIEW: ${{ steps.ai.outputs.response }}
        with:
          script: |
            const review = process.env.REVIEW || '_AI inference returned empty._';
            const body = `<img src="https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/main/.github/assets/icons/shield.svg" width="14" alt="shield"/> &nbsp;**Security Review** · GitHub Models · GPT-4o\n\n---\n\n${review}\n\n---\n_Auto-generated security audit. Triggered by changes in security-sensitive paths or \`security\` label. Add label \`skip-security-review\` to opt out._`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
