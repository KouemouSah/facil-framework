name: Commit Lint

# Validates that commit messages follow the Conventional Commits spec.
# https://www.conventionalcommits.org/

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for commit walking

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install commitlint
        run: |
          # Install in a separate dir to avoid touching the workspaces tree
          mkdir -p /tmp/commitlint && cd /tmp/commitlint
          npm init -y >/dev/null 2>&1
          npm install --no-save --legacy-peer-deps \
            @commitlint/cli@19 \
            @commitlint/config-conventional@19
          # Symlink config from repo
          ln -s "$GITHUB_WORKSPACE/commitlint.config.js" commitlint.config.js
          # Make commitlint available
          echo "PATH=/tmp/commitlint/node_modules/.bin:$PATH" >> $GITHUB_ENV
          echo "COMMITLINT_DIR=/tmp/commitlint" >> $GITHUB_ENV

      - name: Lint commits (PR range)
        if: github.event_name == 'pull_request'
        run: |
          cd "$GITHUB_WORKSPACE" && /tmp/commitlint/node_modules/.bin/commitlint --config /tmp/commitlint/commitlint.config.js \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

      - name: Lint commits (push range)
        if: github.event_name == 'push'
        # BEFORE/AFTER passent par l'ENV plutôt que par une interpolation `${{ }}`
        # dans le script (règle générale : ne jamais injecter du contexte GitHub
        # directement dans un shell).
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          LINT="/tmp/commitlint/node_modules/.bin/commitlint --config /tmp/commitlint/commitlint.config.js"
          ZERO="0000000000000000000000000000000000000000"

          # `github.event.before` est le SHA d'AVANT le push. Après un FORCE-PUSH, ce
          # commit n'existe plus sur le remote -- la plage `$BEFORE..$AFTER` devient
          # alors invalide et le job échouait avec :
          #     fatal: Invalid revision range <before>..<after>
          # quel que soit le contenu des commits. Ça mordait donc à CHAQUE force-push,
          # de n'importe qui. Le test `!= $ZERO` (création de branche) ne suffisait pas :
          # il faut vérifier que le commit est réellement PRÉSENT.
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "$ZERO" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            $LINT --from "$BEFORE" --to "$AFTER" --verbose
          else
            # Nouvelle branche, ou force-push (le SHA d'avant a disparu) : on lint les
            # 10 derniers commits. `|| true` car la plage peut remonter avant l'adoption
            # de la convention.
            echo "note: plage de push indisponible (nouvelle branche ou force-push) -- repli sur les 10 derniers commits." >&2
            $LINT --from HEAD~10 --to HEAD --verbose || true
          fi
