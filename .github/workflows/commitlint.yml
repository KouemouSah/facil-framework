name: Commit Lint

# Validates that commit messages follow the Conventional Commits spec.
# https://www.conventionalcommits.org/

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for commit walking

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install commitlint
        run: |
          # Install in a separate dir to avoid touching the workspaces tree
          mkdir -p /tmp/commitlint && cd /tmp/commitlint
          npm init -y >/dev/null 2>&1
          npm install --no-save --legacy-peer-deps \
            @commitlint/cli@19 \
            @commitlint/config-conventional@19
          # Symlink config from repo
          ln -s "$GITHUB_WORKSPACE/commitlint.config.js" commitlint.config.js
          # Make commitlint available
          echo "PATH=/tmp/commitlint/node_modules/.bin:$PATH" >> $GITHUB_ENV
          echo "COMMITLINT_DIR=/tmp/commitlint" >> $GITHUB_ENV

      - name: Lint commits (PR range)
        if: github.event_name == 'pull_request'
        run: |
          cd "$GITHUB_WORKSPACE" && /tmp/commitlint/node_modules/.bin/commitlint --config /tmp/commitlint/commitlint.config.js \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

      - name: Lint commits (push range)
        if: github.event_name == 'push'
        run: |
          # On push, lint only the new commits in this push
          if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            cd "$GITHUB_WORKSPACE" && /tmp/commitlint/node_modules/.bin/commitlint --config /tmp/commitlint/commitlint.config.js \
              --from "${{ github.event.before }}" \
              --to "${{ github.event.after }}" \
              --verbose
          else
            # Fallback for first push of new branch — lint last 10 commits
            cd "$GITHUB_WORKSPACE" && /tmp/commitlint/node_modules/.bin/commitlint --config /tmp/commitlint/commitlint.config.js --from HEAD~10 --to HEAD --verbose || true
          fi
