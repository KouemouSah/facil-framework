name: CodeQL Security Analysis

# CodeQL requires either:
#   - A PUBLIC repository (free), OR
#   - GitHub Advanced Security (paid, for private repos)
#
# This repo is currently PRIVATE on Free tier. CodeQL is therefore disabled
# until either the repo goes public or Advanced Security is enabled.
#
# To re-enable: uncomment the `on:` section below and ensure code scanning
# is enabled in repository settings (Settings -> Code security and analysis).

on:
  workflow_dispatch:  # manual only for V0
  # push:
  #   branches: [main, develop]
  # pull_request:
  #   branches: [main]
  # schedule:
  #   - cron: '0 6 * * 1'  # weekly Monday 06:00 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
