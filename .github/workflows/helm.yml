name: Helm chart

# Lint + template the facil Helm chart on every change (règle #1 CLAUDE.md:
# aucun build d'image / apply cluster ici — juste lint/rendu à sec).
#
# Garde-secret : la version naïve `grep -Eiq '(password|secret|token): [A-Za-z0-9+/]{8,}'`
# est un no-op structurel contre un manifest k8s rendu (les credentials y
# apparaissent comme `- name: POSTGRES_PASSWORD` / `valueFrom: {secretKeyRef: ...}`,
# jamais en `password: <literal>`). On réutilise donc la vraie assertion déjà
# durcie dans infra/helm/facil/tests/test_render.sh (secretKeyRef présent pour
# chaque credential + aucun littéral `value:` sous un nom de credential), en
# l'appelant directement pour le rendu par défaut ET pour l'overlay on-prem
# (`-f values-onprem.yaml`) — une seule implémentation, zéro duplication/drift.

on:
  push:
    branches: [main, develop]
    paths: ["infra/helm/**", ".github/workflows/helm.yml"]
  pull_request:
    paths: ["infra/helm/**", ".github/workflows/helm.yml"]

concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-template:
    name: lint + template + garde-secret
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with: { version: v3.16.4 }

      - name: helm lint
        run: helm lint infra/helm/facil

      - name: helm template + garde-secret (rendu par défaut)
        run: bash infra/helm/facil/tests/test_render.sh

      - name: helm template + garde-secret (overlay on-prem)
        run: bash infra/helm/facil/tests/test_render.sh -f infra/helm/facil/values-onprem.yaml
