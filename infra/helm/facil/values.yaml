global:
  owner: kouemousah            # ghcr.io/<owner>/facil-*
  imageTag: latest             # surchargé par le provider (version/commit)
  namespace: facil
  storageClass: local-path     # défaut k3s
  # Registre privé (on-prem souverain / GHCR passé en privé) : lister ici les
  # Secret k8s de type kubernetes.io/dockerconfigjson. Vide = pull anonyme, ce
  # qui suffit tant que ghcr.io/<owner>/facil-* reste public.
  # Ex. : imagePullSecrets: [{name: regcred}]
  imagePullSecrets: []

# Nom du k8s Secret (créé par deploy/providers/k3s.py, hors Helm) portant les
# clés : POSTGRES_PASSWORD, REDIS_PASSWORD, MINIO_ROOT_PASSWORD,
# OPENBAO_DEV_ROOT_TOKEN, JWT_SECRET_KEY, SECRET_KEY, ...
secretName: facil-secrets

postgres:
  enabled: true
  image: pgvector/pgvector:pg16
  storage: 10Gi
  db: facil
  user: facil
redis:
  enabled: true
  image: redis:7-alpine
minio:
  enabled: true
  image: minio/minio:latest
  storage: 20Gi
  rootUser: facil
openbao:
  enabled: true
  image: openbao/openbao:latest
  devMode: true                # prod unseal (SOPS+age) = plan ultérieur
backend:
  enabled: true
  port: 8080
  modulesEnabled: "organization,location"
  replicas: 1
frontend:
  enabled: true
  port: 3000
  replicas: 1

# Services gated (P1b) — OFF ici.
caddy: { enabled: false }
keycloak: { enabled: false }
otel: { enabled: false }
ollama: { enabled: false }
mail: { enabled: false }
