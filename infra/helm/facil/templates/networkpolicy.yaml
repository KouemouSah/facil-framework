{{- if .Values.networkPolicy.enabled }}
{{/*
SEC-012 : default-deny sur l'ingress de tout le namespace, puis allow explicites
par composant. k3s embarque le controleur NetworkPolicy de kube-router --
compile DANS le process serveur k3s (PAS un pod/DaemonSet separe : son absence
de `kube-system` ne prouve rien sur l'enforcement, dans un sens ou l'autre) --
donc les NetworkPolicy sont REELLEMENT appliquees, contrairement a un CNI qui
n'implementerait aucun controleur de policy (ou l'aurait explicitement
desactive via `--disable-network-policy`). VERIFIE EMPIRIQUEMENT le 2026-07-14
sur un cluster k3d jetable (k3s v1.35.5+k3s1) : un pod SANS le label
`facil.component` recoit `ECONNREFUSED` instantane sur facil-postgres:5432 ET
facil-redis:6379, tandis qu'un pod portant `facil.component: backend` s'y
connecte normalement -- ET les chaines iptables `KUBE-ROUTER-INPUT/FORWARD/
OUTPUT` sont bien presentes sur le noeud (`docker exec <node> iptables -L -n`).
Detail complet + sortie brute : `SMOKE.md` (section Risque 1). Sans ce fichier,
Postgres:5432 / Redis:6379 / MinIO:9000-9001 / OpenBao:8200 sont joignables par
N'IMPORTE QUEL pod du cluster -- un seul conteneur compromis suffit a atteindre
tout le data-plane.

Durcissement PARTIEL et ASSUME : uniquement l'ingress est deny-by-default.
Un default-deny sur l'EGRESS casserait la resolution DNS (kube-dns vit dans
kube-system, hors du namespace de la release) sans regle egress explicite --
hors scope de cette tache. L'egress de tous les pods reste ouvert.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "facil.fullname" (dict "name" "default-deny") }}
  labels: {{- include "facil.labels" . | nindent 4 }}
spec:
  podSelector: {}          # tous les pods du namespace
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "facil.fullname" (dict "name" "allow-datastores-from-backend") }}
  labels: {{- include "facil.labels" . | nindent 4 }}
spec:
  # Les datastores n'acceptent QUE le backend et les Jobs de hook (migrations +
  # creation du role applicatif) -- sinon le deploiement se bloque (les Jobs
  # doivent joindre Postgres pour db-role/db-init).
  podSelector:
    matchExpressions:
      - key: facil.component
        operator: In
        values: [postgres, redis, minio, openbao]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: facil.component
                operator: In
                values: [backend, db-init, db-role]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "facil.fullname" (dict "name" "allow-backend-from-frontend") }}
  labels: {{- include "facil.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      facil.component: backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              facil.component: frontend
        {{- if .Values.observability.prometheus.enabled }}
        # Prometheus scrape le backend sur /metrics (meme port applicatif). Sans
        # cette source, la cible est DOWN en silence (default-deny).
        - podSelector:
            matchLabels:
              facil.component: prometheus
        {{- end }}
        {{- if .Values.ingress.enabled }}
        # Traefik (ingress controller de k3s) vit dans kube-system : necessaire
        # uniquement si l'Ingress (tache H3) route certains chemins directement
        # vers le backend (ex. /api) plutot que via le frontend.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "facil.fullname" (dict "name" "allow-frontend-from-ingress") }}
  labels: {{- include "facil.labels" . | nindent 4 }}
spec:
  # Le frontend doit toujours accepter Traefik (kube-system), meme si l'Ingress
  # n'est pas encore pose (tache H3) : NodePort/port-forward passent aussi par
  # kube-proxy, pas par un pod de kube-system -- ce cas est couvert par l'egress
  # ouvert. Cette regle securise specifiquement le chemin Ingress -> frontend.
  podSelector:
    matchLabels:
      facil.component: frontend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
{{- if .Values.observability.prometheus.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "facil.fullname" (dict "name" "allow-prometheus-queries") }}
  labels: {{- include "facil.labels" . | nindent 4 }}
spec:
  # Prometheus n'accepte QUE Grafana (PromQL 9090) + kube-system (Ingress/port-forward).
  # Il SCRAPE ses cibles via son egress (ouvert) ; ceci ne concerne que son ingress.
  podSelector:
    matchLabels:
      facil.component: prometheus
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              facil.component: grafana
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: TCP, port: 9090 }
{{- end }}
{{- if .Values.observability.otelCollector.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "facil.fullname" (dict "name" "allow-otel-collector") }}
  labels: {{- include "facil.labels" . | nindent 4 }}
spec:
  # Le collector accepte : l'OTLP du backend (4317/4318) + le scrape Prometheus de
  # son exporter (8889). Il exporte via son egress (ouvert).
  podSelector:
    matchLabels:
      facil.component: otel-collector
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              facil.component: backend
      ports:
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 4318 }
    - from:
        - podSelector:
            matchLabels:
              facil.component: prometheus
      ports:
        - { protocol: TCP, port: 8889 }
{{- end }}
{{- if .Values.observability.grafana.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "facil.fullname" (dict "name" "allow-grafana-ui") }}
  labels: {{- include "facil.labels" . | nindent 4 }}
spec:
  # Grafana n'accepte que l'UI (3000) via Traefik/kube-system (Ingress/port-forward).
  # Il interroge Prometheus/Loki/Tempo via son egress (ouvert).
  podSelector:
    matchLabels:
      facil.component: grafana
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: TCP, port: 3000 }
{{- end }}
{{- if .Values.observability.loki.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "facil.fullname" (dict "name" "allow-loki") }}
  labels: {{- include "facil.labels" . | nindent 4 }}
spec:
  # Loki accepte : l'ingest de logs du collector + les requetes de Grafana (3100).
  podSelector:
    matchLabels:
      facil.component: loki
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { facil.component: otel-collector } }
        - podSelector: { matchLabels: { facil.component: grafana } }
      ports:
        - { protocol: TCP, port: 3100 }
{{- end }}
{{- if .Values.observability.tempo.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "facil.fullname" (dict "name" "allow-tempo") }}
  labels: {{- include "facil.labels" . | nindent 4 }}
spec:
  # Tempo accepte : l'ingest OTLP du collector (4317) + les requetes Grafana (3200).
  podSelector:
    matchLabels:
      facil.component: tempo
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { facil.component: otel-collector } }
      ports:
        - { protocol: TCP, port: 4317 }
    - from:
        - podSelector: { matchLabels: { facil.component: grafana } }
      ports:
        - { protocol: TCP, port: 3200 }
{{- end }}
{{- if .Values.keycloak.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "facil.fullname" (dict "name" "allow-keycloak") }}
  labels: {{- include "facil.labels" . | nindent 4 }}
spec:
  # Keycloak accepte : le backend (echange de token OIDC / JWKS) + kube-system
  # (l'UI de login via Traefik/Ingress). Tout sur 8080.
  podSelector:
    matchLabels:
      facil.component: keycloak
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              facil.component: backend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: TCP, port: 8080 }
{{- end }}
{{- end }}
