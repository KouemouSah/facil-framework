# Global/system roles for the `banking` profile (generic codes).
roles:
  - code: admin
    name: Administrator
    description: Full access (scopable per assignment).
    is_system: true
    grants: ['*']
  - code: branch_manager
    name: Branch Manager
    description: Manage organizations and locations within scope (e.g. a branch).
    is_system: true
    grants: [organization.*, location.*]
  - code: teller
    name: Teller
    description: Read-only on organizations and locations within scope.
    is_system: true
    grants: [organization.read, location.read]
