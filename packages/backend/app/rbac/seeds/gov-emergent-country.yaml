# Global/system roles for the `gov-emergent-country` profile.
# Generic codes (NOT hardcoded gov posts like the legacy `agent_tesoro`); the
# operator names units/sites and assigns these roles at the right scope.
roles:
  - code: admin
    name: Administrator
    description: Full access (scopable per assignment).
    is_system: true
    grants: ['*']
  - code: supervisor
    name: Supervisor
    description: Manage organizations and locations within scope.
    is_system: true
    grants: [organization.*, location.*]
  - code: agent
    name: Agent
    description: Read-only on organizations and locations within scope.
    is_system: true
    grants: [organization.read, location.read]
