{% extends "base.html" %}

{% block content %}
<h2>{{ title }}</h2>
<p>{{ greeting }}</p>
<p>{{ message }}</p>

<div style="text-align: center; margin: 30px 0;">
    <a href="{{ reset_url }}" class="button">{{ button_text }}</a>
</div>

<p>{{ or_copy_text }}</p>
<div class="link-box">
    {{ reset_url }}
</div>

<div class="alert-box alert-warning">
    <p style="margin: 0;"><strong>{{ expiry_label }}</strong> {{ expiry_time }}</p>
</div>

<p>{{ ignore_text }}</p>
{% endblock %}
