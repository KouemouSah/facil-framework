# Network microsegmentation baseline (zero-trust network) — INFRA, not app code.
# Applies to the Facil namespace on k3s/Kubernetes (ADR-0006). Default DENY, then
# allow ONLY the flows the platform needs (limits blast radius if a pod is owned).
#
# Assumes pod labels: app=edge|backend|postgres|redis|minio|openbao|keycloak.
# Adapt the selectors to your Helm chart labels. Apply with `kubectl apply -f`.
# Pair with mTLS (service mesh: Linkerd/Istio, or Caddy internal TLS) for identity
# + encryption in transit — see docs/adr/0008.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: facil
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  # No ingress/egress rules => everything denied by default.
---
# DNS egress for every pod (kube-dns) — otherwise nothing resolves.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: facil
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# Edge (Caddy/WAF) is the ONLY public ingress; it talks to the backend.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge
  namespace: facil
spec:
  podSelector: {matchLabels: {app: edge}}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8443}
        - {protocol: TCP, port: 8090}
  egress:
    - to: [{podSelector: {matchLabels: {app: backend}}}]
      ports: [{protocol: TCP, port: 8080}]
---
# Backend: ingress ONLY from edge; egress ONLY to its data-plane deps.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend
  namespace: facil
spec:
  podSelector: {matchLabels: {app: backend}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: edge}}}]
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to: [{podSelector: {matchLabels: {app: postgres}}}]
      ports: [{protocol: TCP, port: 5432}]
    - to: [{podSelector: {matchLabels: {app: redis}}}]
      ports: [{protocol: TCP, port: 6379}]
    - to: [{podSelector: {matchLabels: {app: minio}}}]
      ports: [{protocol: TCP, port: 9000}]
    - to: [{podSelector: {matchLabels: {app: openbao}}}]
      ports: [{protocol: TCP, port: 8200}]
    - to: [{podSelector: {matchLabels: {app: keycloak}}}]
      ports: [{protocol: TCP, port: 8080}]
---
# Data-plane services: ingress ONLY from the backend (no lateral pod-to-pod).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-plane
  namespace: facil
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [postgres, redis, minio, openbao, keycloak]}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: backend}}}]
